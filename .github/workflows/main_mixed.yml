# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mixed

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_210009E773334105B0A4DDDBE1AF37D8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E349F0960E8348E59326296357436EB4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D691DE35AB29485682995F4A1564913E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mixed'
          slot-name: 'Production'
          package: .
          